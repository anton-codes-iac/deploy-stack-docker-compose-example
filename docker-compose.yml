version: '3.8'
services:
  web:
    image: node:18-alpine
    command: npm start
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://localhost:6379
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
